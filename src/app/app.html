<!-- Subtle Noise Overlay for Cyber-Luxury Texture -->
<div class="noise-overlay pointer-events-none"></div>

<!-- Custom Interactive Magnetic Cursor -->
<app-custom-cursor></app-custom-cursor>

<!-- Floating Glass Pill Navbar -->
<app-navbar (openLeadModal)="openLeadModal()"></app-navbar>

<!-- Main Routed Application View -->
<main class="relative bg-[#FAFBFC] text-slate-900 overflow-hidden min-h-screen">
  
  <!-- Dynamic Page Router View -->
  <router-outlet (activate)="onRouteActivate($event)"></router-outlet>

  <!-- Global Footer -->
  <app-footer></app-footer>

</main>

<!-- Global Multi-Step Onboarding Lead Modal -->
@if (showLeadModal()) {
  <app-onboarding-wizard 
    [prefillMetrics]="prefilledMetrics()" 
    (close)="closeLeadModal()">
  </app-onboarding-wizard>
}
